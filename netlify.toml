# Netlify Configuration for Learn English Next.js 15 App
[build]
  base = "web"
  publish = ".next"
  command = "npm run build"

[build.environment]
  NODE_VERSION = "22"
  SECRETS_SCAN_ENABLED = "false"
  SECRETS_SCAN_OMIT_KEYS = "NEXT_PUBLIC_SUPABASE_URL,NEXT_PUBLIC_SUPABASE_ANON_KEY,NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY,GEMINI_MODEL"

[[plugins]]
  package = "@netlify/plugin-nextjs"
